name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y mpv
      - run: pip install -e '.[test]'
      - run: pytest -q
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install mpv
        shell: pwsh
        run: |
          choco install mpv -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $roots = @("$env:ProgramData/chocolatey/lib", "C:/tools", "$env:ProgramFiles/mpv") | Where-Object { Test-Path $_ }
          $mpv = Get-ChildItem -Path $roots -Filter mpv.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mpv) { throw "Installed mpv.exe was not found; playback tests must not be skipped." }
          "MUSIK_MPV=$($mpv.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mpv.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $mpv.FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pip install -e '.[test]'
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Test Windows playback and background control
        shell: pwsh
        run: |
          python -m pytest -q tests/test_core.py tests/test_app.py tests/test_cli.py tests/test_auth.py tests/test_radio.py tests/test_stream.py tests/test_updater.py tests/test_player.py tests/test_portable.py 2>&1 | Tee-Object -FilePath windows-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            python -c "from pathlib import Path; text=Path('windows-tests.log').read_text(encoding='utf-8', errors='replace'); print('::error title=Windows test failure::'+text[-50000:].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))"
          }
          exit $testExit
        env:
          MUSIK_AUTO_UPDATE: '0'
      - name: Exercise per-user PowerShell installer
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'musik-install-validation'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/install-windows.ps1 -SkipDependencies -InstallDirectory $install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$install/bin/musik.cmd" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$install/bin/musik.cmd" stop
          exit $LASTEXITCODE
        env:
          MUSIK_AUTO_UPDATE: '0'
